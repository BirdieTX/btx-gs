---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: btx-gs
description: This is my personal OS image.
base-image: ghcr.io/birdietx/silverblue-gs
image-version: latest

modules:

  - type: dnf
    repos:
      enable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        enable:
          - ublue-os/packages

  - type: script
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"

  - type: dnf
    install:
      packages:
        - antimicrox
        - audacity
        - blender
        - bolt-launcher
        - bustle
        - dconf-editor
        - discord
        - freedoom
        - freedoom2
        - gnome-tweaks
        - HandBrake-gui
        - hydrapaper
        - inkscape
        - kdenlive
        - kpat
        - kvantum
        - gimp
        - lutris
        - openttd
        - osu-lazer
        - pitivi
        - polari
        - proton-vpn-gtk-app
        - protonplus
        - protontricks
        - remmina
        - signal-desktop

  - type: default-flatpaks
    configurations:
      - notify: false
        install:
          - com.belmoussaoui.Decoder
          - com.belmoussaoui.Obfuscate
          - com.markopejic.downloader
          - com.mattjakeman.ExtensionManager
          - com.pokemmo.PokeMMO
          - com.rafaelmardojai.Blanket
          - com.vixalien.sticky
          - dev.bragefuglseth.Keypunch
          - io.edcd.EDMarketConnector
          - io.gitlab.adhami3310.Converter
          - io.github.diegoivan.pdf_metadata_editor
          - io.github.fizzyizzy05.binary
          - io.github.idevecore.Valuta
          - io.github.plrigaux.sysd-manager
          - io.github.Soundux
          - io.github.wartybix.Constrict
          - md.obsidian.Obsidian
          - me.proton.Mail
          - me.proton.Pass
          - net.runelite.RuneLite
          - org.desktop_plus.desktop-plus
          - org.gnome.gitlab.YaLTeR.VideoTrimmer
          - org.localsend.localsend_app

  - type: signing
