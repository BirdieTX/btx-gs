---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: btx-gs
description: This is my personal OS image.
base-image: ghcr.io/birdietx/silverblue-gs
image-version: latest

modules:

  - type: dnf
    repos:
      enable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        enable:
          - ublue-os/packages

  - type: script
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"

  # Bottles is installed in its own layer without weak dependencies
  # to avoid dependency conflicts with other packages.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - bottles

  # 932 MiB
  - type: dnf
    install:
      packages:
        - antimicrox
        - audacity
        - bolt-launcher
        - bustle
        - dconf-editor
        - discord
        - fragments
        - freedoom
        - freedoom2
        - gimp
        - gnome-firmware
        - gnome-tweaks
        - HandBrake-gui
        - hardinfo2
        - hydrapaper

  # 833 MiB
  - type: dnf
    install:
      packages:
        - inkscape
        - kdenlive
        - kid3
        - kmousetool
        - kolourpaint
        - kpat
        - krename

  - type: dnf
    install:
      packages:
        - krita
        - kvantum
        - openttd
        - mediawriter
        - obs-studio
        - okteta
        - openttd
        - osu-lazer
        - polari
        - proton-vpn-gtk-app
        - protonplus
        - qbittorrent
        - remmina

  - type: dnf
    install:
      packages:
        - signal-desktop
        - virt-manager
        - vlc
        - vlc-plugins-all
        - waycheck

  - type: dnf
    install:
      packages:
        - blender

  - type: dnf
    install:
      packages:
        - pitivi

  - type: dnf
    install:
      packages:
        - protontricks

  - type: dnf
    install:
      packages:
        - lutris

  - type: script
    snippets:
      - "rm -f /usr/share/applications/com.protonvpn.www.desktop"

  - type: default-flatpaks
    configurations:
      - notify: false
        install:
          - com.belmoussaoui.Decoder
          - com.belmoussaoui.Obfuscate
          - com.markopejic.downloader
          - com.pokemmo.PokeMMO
          - com.rafaelmardojai.Blanket
          - dev.bragefuglseth.Keypunch
          - io.edcd.EDMarketConnector
          - io.gitlab.adhami3310.Converter
          - io.github.diegoivan.pdf_metadata_editor
          - io.github.fizzyizzy05.binary
          - io.github.idevecore.Valuta
          - io.github.plrigaux.sysd-manager
          - io.github.Soundux
          - io.github.wartybix.Constrict
          - md.obsidian.Obsidian
          - me.proton.Mail
          - me.proton.Pass
          - net.runelite.RuneLite
          - org.desktop_plus.desktop-plus
          - org.gnome.gitlab.YaLTeR.VideoTrimmer
          - org.localsend.localsend_app

  - type: signing
